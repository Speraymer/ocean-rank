  <title>终审通道已关闭｜Ocean Rank</title>
  <style>
    *{box-sizing:border-box}

    h1{margin:16px 0 14px;font-size:clamp(34px,8vw,58px);letter-spacing:-.04em}
    p{max-width:460px;margin:0 auto;color:#9bb0ba;font-size:13px;line-height:1.9}
    a{display:inline-block;margin-top:30px;padding:13px 22px;border:1px solid #36e6ff66;background:#092837;color:#a9f5ff;text-decoration:none;font-size:11px;letter-spacing:.08em}

<body>
  <main>
    <small>OCEAN OF US · FINAL JUDGING</small>
